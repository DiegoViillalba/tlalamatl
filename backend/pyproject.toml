[project]
name = "tlalamatl-backend"
version = "0.1.0"
description = "API mock de Tlalamatl (FastAPI + SQLModel + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi[standard]>=0.162.0",
    "google-genai>=1.0.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
